name: Firestore security regression tests

on:
  pull_request:
    paths:
      - "releaseflow-v2/firestore.rules"
      - "releaseflow-v2/firebase.json"
      - "releaseflow-v2/security-tests/firestore/**"
      - ".github/workflows/firestore-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install isolated test dependencies
        working-directory: releaseflow-v2/security-tests/firestore
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules security suite against local emulator
        working-directory: releaseflow-v2/security-tests/firestore
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npm test
